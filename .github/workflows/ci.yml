name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The daemon (Zig): builds, tests, and format-checks on Linux and macOS.
  build-test-fmt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Check formatting
        run: zig fmt --check .

  # The release page's notes are a hand-written file, and v0.10.0 shipped with
  # v0.9.2's text in it: the release commit bumped the versions and the
  # changelog and forgot this one, and nothing anywhere noticed. Whoever reads
  # that page is told about a release that is not the one they are downloading.
  #
  # So the version has to appear in the notes. It is one grep, it runs on every
  # push, and it fails the moment a bump and its notes disagree.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The release notes name the version being released
        run: |
          version="$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' gui/app.zon | head -1)"
          [ -n "$version" ] || { echo "could not read the version from gui/app.zon"; exit 1; }
          if ! grep -qF "What's new in v$version" .github/RELEASE_NOTES.md; then
            echo "gui/app.zon says $version, but .github/RELEASE_NOTES.md does not say"
            echo "\"What's new in v$version\". The release page takes its text from that"
            echo "file, so publishing now would describe a different release."
            echo
            echo "It currently says:"
            grep -n "What's new in" .github/RELEASE_NOTES.md || echo "  (nothing)"
            exit 1
          fi
          echo "release notes are for v$version"

      # The installer verifies the file it downloaded, not whatever is listed
      # first. The script read the first `sha256:` in the release JSON, which
      # was correct while a release carried one asset and became wrong the
      # moment the Linux tarballs were added: GitHub lists assets in upload
      # order, so the first digest belongs to whichever packaging job finished
      # first. On v0.10.11 that is the Linux aarch64 tarball, so every macOS
      # install failed with a checksum mismatch on a perfectly good download.
      #
      # The checks live in the script so they can be run by hand, and so this
      # file does not carry shell that only ever runs on a runner.
      - name: The macOS installer verifies the macOS download
        run: scripts/check-macos-installer.sh ${{ github.repository }} .

  # The GUI (Native SDK): macOS only, via the native CLI.
  gui:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@0.10.1

      - name: Check markup and manifest
        run: native check

      # Load-bearing beyond the usual: this is where the permission-declaration
      # test runs. Nothing else here launches the GUI, so `check` and `build`
      # both pass on an app that cannot reach its own daemon. That shipped once.
      - name: Test
        run: native test

      - name: Build
        run: native build

      - name: Check formatting
        run: zig fmt --check src

  # Packages the Linux tarball on every pull request, for both architectures.
  #
  # release.yml builds these on a tag and uploads them into the release, and a
  # release is the one artifact nobody gets to re-check. So the script runs
  # here, where a break is a red X on a pull request rather than a published
  # release missing half its downloads, and the `ubuntu-24.04-arm` label is
  # proven here before the release path is allowed to depend on it.
  linux-package:
    name: linux-package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@0.10.1

      # gtk4 only. Notary draws on a canvas and declares no web use, so the host
      # compiles with the WebKitGTK stub and links gtk4 and libdl and nothing
      # else. Installing WebKit here would hide a regression that made it real.
      - name: Install the Linux host dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - name: Build the daemon
        run: cd daemon && zig build -Doptimize=ReleaseFast -Dcpu=baseline

      - name: Package
        run: gui/scripts/package-linux.sh --signer daemon/zig-out/bin/signer --output dist

      # The installer derives the file name from `uname -m`, so a tarball named
      # for the wrong architecture is a 404 for whoever the runner was not.
      - name: The tarball is for the architecture this runner actually is
        run: |
          got="$(ls dist/notary-*-linux-*.tar.gz | head -1)"
          case "$got" in
            *-linux-${{ matrix.arch }}.tar.gz) echo "$got" ;;
            *) echo "expected a ${{ matrix.arch }} tarball, packaged $got" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: notary-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
